name: docker-build-ascend-a2-multiarch

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".dockerignore"
      - "docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.x86"
      - "docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.arm"
      - ".github/workflows/docker-build-ascend-a2.yml"
  release:
    types: [ published ]

env:
  QUAY_REPO: quay.io/ascend/veomni
  CACHE_REPO: ghcr.io/bytedance-seed/veomni
  ARTIFACT_PREFIX: digests-a2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-digest:
    name: Build ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'ByteDance-Seed' }}
    strategy:
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            tag: amd64
            dockerfile: ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.x86
          - arch: linux/arm64
            runner: ubuntu-22.04-arm
            tag: arm64
            dockerfile: ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.arm

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to GHCR (for cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute cache tag
        id: cache-tag
        run: |
          echo "value=buildcache-a2-${{ matrix.tag }}" >> $GITHUB_OUTPUT

      - name: Build and push (by digest)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.arch }}
          outputs: type=image,name=${{ env.QUAY_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE_REPO }}:${{ steps.cache-tag.outputs.value }}
          cache-to: type=registry,ref=${{ env.CACHE_REPO }}:${{ steps.cache-tag.outputs.value }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    runs-on: ubuntu-latest
    needs: build-push-digest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          merge-multiple: true

      - name: Get base image tag
        id: base_image
        run: |
          BASE_IMAGE_FULL=$(grep '^FROM' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.x86 | head -1 | cut -d' ' -f2)
          BASE_IMAGE_TAG=$(echo "$BASE_IMAGE_FULL" | cut -d':' -f2)
          echo "base_image_tag=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Compute final tag
        id: version
        env:
          BASE_IMAGE_TAG: ${{ steps.base_image.outputs.base_image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Tag scheme: {version}-cann{CANN}-torch_npu{torch_npu}-{product}-{os}-{python}-veomni
          # e.g. v0.1.11-cann9.1.0-torch_npu2.10.0.post4-910b-ubuntu22.04-py3.12-veomni
          BASE_TAG="$BASE_IMAGE_TAG"
          CANN=$(echo "$BASE_TAG" | cut -d'-' -f1)
          PRODUCT=$(echo "$BASE_TAG" | cut -d'-' -f2)
          OS=$(echo "$BASE_TAG" | cut -d'-' -f3)
          PYTHON=$(echo "$BASE_TAG" | cut -d'-' -f4)
          TORCH_NPU=$(grep -oE 'torch-npu==[0-9A-Za-z.]+' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_910b.x86 | head -1 | cut -d'=' -f3)
          # Release builds use the published release tag. Main and manual builds
          # intentionally republish the latest v* release line (tags are mutable).
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          fi
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "Invalid VeOmni version tag: $VERSION" >&2; exit 1 ;;
          esac
          TAG="${VERSION}-cann${CANN}-torch_npu${TORCH_NPU}-${PRODUCT}-${OS}-${PYTHON}-veomni"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Final tag: ${TAG}"

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge and push multi-arch image
        env:
          IMAGE: ${{ env.QUAY_REPO }}
          TAG: ${{ env.QUAY_REPO }}:${{ steps.version.outputs.tag }}
        run: |
          DIGESTS=$(printf "$IMAGE@sha256:%s " $(ls ${{ runner.temp }}/digests))
          docker buildx imagetools create -t $TAG $DIGESTS
          echo "✅ Multi-arch image published: $TAG"
