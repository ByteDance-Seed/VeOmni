name: Check docs build

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/**"
      - "docs/**"
      - "configs/**"
      - "tasks/**"
      - "tests/**"
      - "veomni/**"
      - "train.sh"
      - ".readthedocs.yaml"
      - ".github/workflows/check_docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/**"
      - "docs/**"
      - "configs/**"
      - "tasks/**"
      - "tests/**"
      - "veomni/**"
      - "train.sh"
      - ".readthedocs.yaml"
      - ".github/workflows/check_docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/requirements-lock.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements-lock.txt

      - name: Build documentation with warnings as errors
        run: make -C docs html SPHINXOPTS=-W

      - name: Test documentation integrity checker
        run: python -m unittest discover -s tests/special_sanity -p test_docs_integrity.py

      - name: Check local links, rendered anchors, and navigation
        run: python scripts/ci/check_docs_integrity.py
