name: device-api-check

# No need to avoid / cancel lightweight device api check job
on:
  pull_request:
  push:
    branches:
      - main

# Declare permissions just read content.
permissions:
  contents: read

jobs:
  device-api-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: .
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run device api usage normativity in VeOmni/tasks
        run: |
          python tests/special_sanity/check_device_api_usage.py -d tasks
      - name: Run device api usage normativity in VeOmni/veomni
        run: |
          python tests/special_sanity/check_device_api_usage.py -d veomni
      - name: Run device api usage normativity in VeOmni/tests
        run: |
          python tests/special_sanity/check_device_api_usage.py -d tests
      - name: Run ops architecture and generated signature guards
        run: |
          python -m pip install "pytest>=6.0.0,<8.0"
          PYTHONPATH=. pytest --noconftest tests/special_sanity/test_ops_architecture.py tests/ops/base/test_op_documentation.py tests/models/transformers/test_generated_call_site_signatures.py
