name: device-api-check

# No need to avoid / cancel lightweight device api check job
on:
  pull_request:
  push:
    branches:
      - main

# Declare permissions just read content.
permissions:
  contents: read

jobs:
  device-api-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: .
      - uses: actions/setup-python@v3
      - name: Run device api usage normativity in VeOmni/tasks
        run: |
          python tests/special_sanity/check_device_api_usage.py -d tasks
      - name: Run device api usage normativity in VeOmni/veomni
        run: |
          python tests/special_sanity/check_device_api_usage.py -d veomni
      - name: Run device api usage normativity in VeOmni/tests
        run: |
          python tests/special_sanity/check_device_api_usage.py -d tests
      - name: Run ops architecture guards
        run: |
          python -c "from tests.special_sanity.test_ops_architecture import test_active_tree_uses_ops_architecture_paths, test_model_entry_points_forward_ops_selection; test_active_tree_uses_ops_architecture_paths(); test_model_entry_points_forward_ops_selection()"
          python -c "from tests.ops.base.test_op_documentation import test_owned_op_modules_and_callables_have_docstrings; test_owned_op_modules_and_callables_have_docstrings()"
