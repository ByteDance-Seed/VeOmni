name: Build CANN 9.2.1 A2 candidate
on:
  workflow_dispatch:
  push:
    branches: [zpl1n/ascend-cann921-a2-a3]
    paths:
      - .github/workflows/build-cann921-a2.yml
      - docker/ascend/**
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image tag
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veomni:cann921-a2-x86-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ascend/Dockerfile.ascend_9.2.1_torch_npu2.10.0.post7_910b.x86
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ai.veomni.docker-revision=${{ github.sha }}
            ai.veomni.fla-revision=a7c608f2e3f828779ceeec1fcf155a6e37ede83c
            ai.veomni.target=a2
          build-args: FLA_BUILD_JOBS=4
      - name: Publish candidate
        run: |
          docker push "$IMAGE"
          echo "Candidate image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
