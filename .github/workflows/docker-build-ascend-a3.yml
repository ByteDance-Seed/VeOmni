name: docker-build-ascend-a3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".dockerignore"
      - "docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_a3"
      - ".github/workflows/docker-build-ascend-a3.yml"
  release:
    types: [ published ]

jobs:
  build-ascend-image-a3:
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'ByteDance-Seed' }}
    runs-on: ubuntu-22.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-ascend-image-a3
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Remove unnecessary parts in github actions runners to free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get base image tag
        id: base_image
        run: |
          BASE_IMAGE_FULL=$(grep '^FROM' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_a3 | head -1 | cut -d' ' -f2)
          echo "Base image full: $BASE_IMAGE_FULL"
          BASE_IMAGE_TAG=$(echo "$BASE_IMAGE_FULL" | cut -d':' -f2)
          echo "Base image tag: $BASE_IMAGE_TAG"
          echo "base_image_tag=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get image tag
        id: version
        run: |
          # Tag scheme: {version}-cann{CANN}-torch_npu{torch_npu}-{product}-{os}-{python}-veomni
          # e.g. v0.1.11-cann9.1.0-torch_npu2.10.0.post4-a3-ubuntu22.04-py3.12-veomni
          BASE_TAG="${{ steps.base_image.outputs.base_image_tag }}"
          CANN=$(echo "$BASE_TAG" | cut -d'-' -f1)
          PRODUCT=$(echo "$BASE_TAG" | cut -d'-' -f2)
          OS=$(echo "$BASE_TAG" | cut -d'-' -f3)
          PYTHON=$(echo "$BASE_TAG" | cut -d'-' -f4)
          TORCH_NPU=$(grep -oE 'torch-npu==[0-9A-Za-z.]+' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_a3 | head -1 | cut -d'=' -f3)
          # Release builds use the published release tag. Main and manual builds
          # intentionally republish the latest v* release line (tags are mutable).
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          fi
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "Invalid VeOmni version tag: $VERSION" >&2; exit 1 ;;
          esac
          TAG="${VERSION}-cann${CANN}-torch_npu${TORCH_NPU}-${PRODUCT}-${OS}-${PYTHON}-veomni"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Final tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Clean Docker cache before build
        run: |
          docker system prune -a -f --volumes || true

      - name: Build and push images Quay
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post4_a3
          push: true
          tags: |
            quay.io/ascend/veomni:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple
