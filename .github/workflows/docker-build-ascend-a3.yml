name: docker-build-ascend-a3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post2_a3"
      - ".github/workflows/docker-build-ascend-a3.yml"
  release:
    types: [ published ]

jobs:
  build-ascend-image-a3:
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'ByteDance-Seed' }}
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-ascend-image-a3
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Remove unnecessary parts in github actions runners to free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get base image name and tag
        id: base_image
        run: |
          BASE_IMAGE_FULL=$(grep '^FROM' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post2_a3 | head -1 | cut -d' ' -f2)
          echo "Base image full: $BASE_IMAGE_FULL"
          BASE_IMAGE_TAG=$(echo "$BASE_IMAGE_FULL" | cut -d':' -f2)
          echo "Base image tag: $BASE_IMAGE_TAG"
          NEW_IMAGE_NAME="veomni-$BASE_IMAGE_TAG"
          echo "New image name: $NEW_IMAGE_NAME"
          echo "base_image_tag=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "new_image_name=$NEW_IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Get image tag
        id: version
        run: |
          # Tag scheme: {version}-cann{CANN}-torch_npu{torch_npu}-{product}-{os}-py{py}-veomni
          # e.g. v0.1.11-cann9.1.0-torch_npu2.10.0.post2-a3-ubuntu22.04-py3.12-veomni
          # The tag is mutable: re-running the workflow on the same release tag overwrites it.
          BASE_TAG="${{ steps.base_image.outputs.base_image_tag }}"   # e.g. 9.1.0-a3-ubuntu22.04-py3.12
          CANN=$(echo "$BASE_TAG"    | cut -d'-' -f1)
          PRODUCT=$(echo "$BASE_TAG" | cut -d'-' -f2)
          OS=$(echo "$BASE_TAG"      | cut -d'-' -f3)
          PY=$(echo "$BASE_TAG"      | cut -d'-' -f4)
          TORCH_NPU=$(grep -oiP 'torch-npu==\K[0-9a-z.]+' ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post2_a3 | head -1)
          VERSION=$(git describe --tags --abbrev=0)   # latest release tag, e.g. v0.1.11
          TAG="${VERSION}-cann${CANN}-torch_npu${TORCH_NPU}-${PRODUCT}-${OS}-${PY}-veomni"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Final tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Clean Docker cache before build
        run: |
          docker system prune -a -f --volumes || true

      - name: Build and push images Quay
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: ./docker/ascend/Dockerfile.ascend_9.1.0_torch_npu2.10.0.post2_a3
          push: true
          tags: |
            quay.io/ascend/veomni:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PIP_INDEX=https://pypi.org/simple
