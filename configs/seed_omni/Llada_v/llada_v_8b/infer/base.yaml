# LLaDA-V-8B inference: image-conditioned low-confidence remasking, one module.
#
#   bash train.sh tasks/omni/infer_omni.py configs/seed_omni/Llada_v/llada_v_8b/infer/base.yaml \
#     --model.model_path /path/to/LLaDA-V-veomni \
#     --infer.prompt "Describe this image." \
#     --infer.images /path/to/image.png
#
# `gen_length` is the answer budget and `diffusion_steps` the denoising passes
# inside the module; `max_new_tokens` bounds FSM passes and must be at least
# `diffusion_steps` plus the pass that lays out the prompt.
model:
  model_path: LLaDA-V-veomni
  model_config:
    modules: configs/seed_omni/Llada_v/llada_v_8b/infer/modules_infer.yaml
    chat_template: llada
    max_seq_len: 2048
    text_keys: messages
    infer_graph:
      infer_gen: configs/seed_omni/Llada_v/llada_v_8b/infer/graph_infer_gen.yaml
    infer_type: infer_gen
  ops_implementation:
    attn_implementation: flash_attention_2

# `OmniArguments` requires a data block even for a generation-only launch;
# nothing under it is read on this path.
data:
  data_type: seedomni
  train_path: /mnt/hdfs/user_dir/text_diff/dllm_trainer/data/mm_train.jsonl
  datasets_type: mapping
  source_name: sharegpt4v_sft
  max_seq_len: 2048
  dataloader:
    type: native
    num_workers: 0

infer:
  output_dir: /tmp/omni_llada_v_infer
  generation_kwargs:
    gen_length: 128
    diffusion_steps: 64
    max_new_tokens: 128
