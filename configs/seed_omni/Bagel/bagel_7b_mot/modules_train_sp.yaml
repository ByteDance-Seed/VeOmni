# Per-module SP for BAGEL. Only bagel_qwen2_mot.forward and the inherited base
# text-encoder encode path use the owner-loop runtime in this configuration.
#
# The outer Omni trainer must keep ulysses_size=1. Each rank loads its own DP
# shard. The graph broadcasts one owner's packed MoT tensors at a time; Ulysses
# shards that owner's Q/K/V heads and sequence, and one dense masked SDPA call per
# decoder layer preserves BAGEL causal/full/noise visibility. The other Bagel
# modules listed below retain their legacy redistribution paths.
#
# Topology:
#   * outer trainer          : ulysses_size = 1
#   * bagel_vae              : ulysses_size = 4  (legacy image-batch redistribution)
#   * bagel_siglip_navit     : ulysses_size = 4  (legacy image redistribution)
#   * bagel_text_encoder     : ulysses_size = 4  (encode inherits base owner-loop)
#   * bagel_flow_connector   : ulysses_size = 4  (legacy gather-concat)
#   * bagel_qwen2_mot        : ulysses_size = 4  (owner-loop dense-mask Ulysses)
#
# World-size rule: world % 4 == 0.
# Keep fsdp_config.sp_keep_params_unsharded disabled for bagel_qwen2_mot: the
# complete MoT parameter set staying resident across an owner burst can OOM.
bagel_vae:
  model:
    model_path: bagel_vae

  accelerator:
    ulysses_size: 4

bagel_siglip_navit:
  model:
    model_path: bagel_siglip_navit

  accelerator:
    ulysses_size: 4

bagel_text_encoder:
  model:
    model_path: bagel_text_encoder

  accelerator:
    ulysses_size: 4

bagel_flow_connector:
  model:
    model_path: bagel_flow_connector

  accelerator:
    ulysses_size: 4

bagel_qwen2_mot:
  model:
    model_path: bagel_qwen2_mot

  accelerator:
    ulysses_size: 4
