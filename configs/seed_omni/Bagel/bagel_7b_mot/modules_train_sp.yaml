# Per-module SP for BAGEL: VAE/SigLIP redistribute whole images while
# bagel_qwen2_mot shards packed sequence compute.
#
# The outer Omni trainer must keep ulysses_size=1. Each rank loads its own DP
# shard. VAE/SigLIP balance complete images across their module-SP groups without
# splitting an image's internal codec/ViT sequence. bagel_qwen2_mot gathers its
# group's distinct packed sequences, shards attention/MLP compute, then restores
# each rank's own carrier segment.
#
# Topology:
#   * outer trainer          : ulysses_size = 1
#   * bagel_vae              : ulysses_size = 4  (image-batch redistribution)
#   * bagel_siglip_navit     : ulysses_size = 4  (image-batch redistribution)
#   * bagel_text_encoder     : ulysses_size = 4  (embedding / LM-head sequence)
#   * bagel_qwen2_mot        : ulysses_size = 4
#   * bagel_flow_connector   : ulysses_size = 1
#
# World-size rule: world % 4 == 0.
bagel_vae:
  model:
    model_path: bagel_vae

  accelerator:
    ulysses_size: 4

bagel_siglip_navit:
  model:
    model_path: bagel_siglip_navit

  accelerator:
    ulysses_size: 4

bagel_text_encoder:
  model:
    model_path: bagel_text_encoder

  accelerator:
    ulysses_size: 4

bagel_flow_connector:
  model:
    model_path: bagel_flow_connector

bagel_qwen2_mot:
  model:
    model_path: bagel_qwen2_mot

  accelerator:
    ulysses_size: 4
