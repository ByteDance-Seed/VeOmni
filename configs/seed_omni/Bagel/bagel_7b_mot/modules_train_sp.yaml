# Per-module SP for BAGEL. bagel_qwen2_mot.forward, bagel_siglip_navit.forward,
# bagel_vae.encode, and the inherited base text-encoder encode path use the
# looped SP runtime.
#
# The outer Omni trainer must keep ulysses_size=1. Each rank loads its own DP
# shard. The graph broadcasts one sample's packed MoT tensors at a time; Ulysses
# shards that sample's Q/K/V heads and sequence, and one dense masked SDPA call per
# decoder layer preserves BAGEL causal/full/noise visibility. SigLIP and VAE shard
# complete image canvases along the batch dimension. Flow shards each active
# sample's latent/hidden token sequence before its pointwise projections.
#
# Topology:
#   * outer trainer          : ulysses_size = 1
#   * bagel_vae              : ulysses_size = 4  (looped SP, image-batch sharding)
#   * bagel_siglip_navit     : ulysses_size = 4  (looped SP, whole-image batch sharding)
#   * bagel_text_encoder     : ulysses_size = 4  (encode inherits base looped SP)
#   * bagel_flow_connector   : ulysses_size = 4  (looped token-shard SP)
#   * bagel_qwen2_mot        : ulysses_size = 4  (looped SP, dense-mask Ulysses)
#
# World-size rule: world % 4 == 0.
# Keep fsdp_config.sp_keep_params_unsharded disabled for bagel_qwen2_mot: the
# complete MoT parameter set staying resident across a sample loop can OOM.
bagel_vae:
  model:
    model_path: bagel_vae

  accelerator:
    ulysses_size: 4

bagel_siglip_navit:
  model:
    model_path: bagel_siglip_navit

  accelerator:
    ulysses_size: 4

bagel_text_encoder:
  model:
    model_path: bagel_text_encoder

  accelerator:
    ulysses_size: 4

bagel_flow_connector:
  model:
    model_path: bagel_flow_connector

  accelerator:
    ulysses_size: 4

bagel_qwen2_mot:
  model:
    model_path: bagel_qwen2_mot

  accelerator:
    ulysses_size: 4
