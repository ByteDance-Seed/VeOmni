# fake_module_a -> fake_module_b SeedOmni V2 launcher: the smallest config that
# drives OmniTrainer / OmniInferencer end to end. The modules are single linear
# maps, so this exercises the launch path, not a model.
#
# Prerequisites (any directory works; the paths below are only defaults):
#   echo '{"model_type": "fake_omni", "hidden_size": 8}' > /tmp/fake_omni_src/config.json
#   python scripts/seed_omni/convert_model.py \
#     --model_path /tmp/fake_omni_src --output_dir /tmp/fake_omni
#   # data: tulu-format jsonl, one sample per line, e.g.
#   # {"source_name": "tulu-3-sft-mixture", "conversations": {"messages": [
#   #   {"role": "user", "content": "hi"}, {"role": "assistant", "content": "hello"}]}}
#
# Train (2 GPUs):
#   bash train.sh tasks/omni/train_omni.py configs/seed_omni/fake_model/train/base.yaml \
#     --data.train_path /tmp/fake_omni_data.jsonl
#
# Infer (single-process eager, or distributed with modules_infer_fsdp.yaml):
#   python tasks/omni/infer_omni.py configs/seed_omni/fake_model/train/base.yaml \
#     --model.model_config.modules configs/seed_omni/fake_model/infer/modules_infer_eager.yaml \
#     --infer.prompt "hi"
model:
  model_path: /tmp/fake_omni
  model_config:
    modules: configs/seed_omni/fake_model/train/modules_train.yaml
    train_graph: configs/seed_omni/fake_model/train/graph_train.yaml
    infer_graph:
      infer_gen: configs/seed_omni/fake_model/infer/graph_infer_gen.yaml
      infer_und: configs/seed_omni/fake_model/infer/graph_infer_und.yaml
    infer_type: infer_gen

  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32

  optimizer:
    type: adamw
    lr: 1.0e-3
    lr_warmup_ratio: 0.0
    lr_decay_style: constant
    weight_decay: 0.0
    max_grad_norm: 1.0


data:
  data_type: seedomni
  train_path: /tmp/fake_omni_data.jsonl
  datasets_type: mapping
  dataloader:
    type: native
    num_workers: 0
    drop_last: true


train:
  seed: 42
  num_train_epochs: 1
  global_batch_size: 4
  micro_batch_size: 1
  dyn_bsz: false

  checkpoint:
    output_dir: outputs/fake_omni
    save_steps: 2
    save_epochs: 0
    save_hf_weights: true
    hf_save_steps: 0
    hf_save_epochs: 0

infer:
  output_dir: outputs/fake_omni_infer
