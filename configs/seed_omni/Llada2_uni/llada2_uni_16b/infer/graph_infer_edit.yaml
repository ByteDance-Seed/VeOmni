# LLaDA2.0-Uni-16B inference — image editing (3-way editing CFG VQ block diffusion).
initial: edit_encode

states:
  edit_encode:
    body:
      - { from: llada2_uni_image_tokenizer, to: end }
    transitions:
      - { condition: { type: default }, next_state: edit_diffuse }

  edit_diffuse:
    body:
      - { from: llada2_uni_text_encoder, to: llada2_uni_llm }
      - { from: llada2_uni_llm,          to: llada2_uni_text_encoder }
      - { from: llada2_uni_text_encoder, to: end }
    transitions:
      - { condition: { type: module_signal, key: vq_done }, next_state: decode }
      - { condition: { type: default }, next_state: edit_diffuse }

  decode:
    body:
      - { from: llada2_uni_decoder, to: end }
    transitions:
      - { condition: { type: module_signal, key: image_complete }, next_state: done }
      - { condition: { type: default }, next_state: done }
