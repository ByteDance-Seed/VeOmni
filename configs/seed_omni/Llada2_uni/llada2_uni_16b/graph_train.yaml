# Convert-time training DAGs for LLaDA2.0-Uni, keyed by train_type.
default:
  - { from: llada2_uni_image_tokenizer.encode, to: llada2_uni_text_encoder.encode }
  - { from: llada2_uni_text_encoder.encode,    to: llada2_uni_llm }
  - { from: llada2_uni_llm,                    to: llada2_uni_text_encoder.decode }
  - { from: llada2_uni_text_encoder.decode,    to: end }

offline_cache:
  - { from: llada2_uni_image_tokenizer.offline_encode, to: end }

with_cache:
  - { from: llada2_uni_image_tokenizer.online_process, to: llada2_uni_text_encoder.encode }
  - { from: llada2_uni_text_encoder.encode,            to: llada2_uni_llm }
  - { from: llada2_uni_llm,                            to: llada2_uni_text_encoder.decode }
  - { from: llada2_uni_text_encoder.decode,            to: end }
