# LLaDA2.0-Uni-16B SeedOmni training + inference launcher.
#
# Launch training directly from a VeOmni-converted checkpoint (via OmniHFLayout):
#   bash train.sh tasks/omni/train_omni.py configs/seed_omni/Llada2_uni/llada2_uni_16b/train/base.yaml \
#     --model.model_path /mnt/hdfs/user_dir/text_diff/dllm_trainer/ckpt/LLaDA2.0-Uni-veomni
#
# Or from a split SeedOmni checkpoint:
#   python scripts/seed_omni/convert_model.py \
#     --model_path /mnt/hdfs/user_dir/text_diff/llada_uni/ckpt/LLaDA2.0-Uni \
#     --output_dir /mnt/hdfs/user_dir/text_diff/dllm_trainer/ckpt/LLaDA2.0-Uni-omni
#   bash train.sh tasks/omni/train_omni.py configs/seed_omni/Llada2_uni/llada2_uni_16b/train/base.yaml
#
# Launch inference (eager single-process or FSDP2 distributed):
#   python tasks/omni/infer_omni.py configs/seed_omni/Llada2_uni/llada2_uni_16b/train/base.yaml \
#     --model.model_config.modules configs/seed_omni/Llada2_uni/llada2_uni_16b/infer/modules_infer_eager.yaml \
#     --infer.prompt "Describe this image." --infer.images /path/to/image.jpg

model:
  model_path: LLaDA2.0-Uni-veomni
  model_config:
    modules: configs/seed_omni/Llada2_uni/llada2_uni_16b/train/modules_train.yaml
    train_graph: configs/seed_omni/Llada2_uni/llada2_uni_16b/train/graph_train.yaml
    infer_graph:
      infer_und: configs/seed_omni/Llada2_uni/llada2_uni_16b/infer/graph_infer_und.yaml
      infer_t2i: configs/seed_omni/Llada2_uni/llada2_uni_16b/infer/graph_infer_t2i.yaml
      infer_t2i_thinking: configs/seed_omni/Llada2_uni/llada2_uni_16b/infer/graph_infer_t2i_thinking.yaml
      infer_edit: configs/seed_omni/Llada2_uni/llada2_uni_16b/infer/graph_infer_edit.yaml
    infer_type: infer_und
  ops_implementation:
    attn_implementation: flash_attention_2
    moe_implementation: fused_triton

  accelerator:
    ulysses_size: 1
    init_device: meta
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      reshard_after_forward: true
      reshard_after_backward: true
      forward_prefetch: true
      offload: false
      max_load_broadcast_size: 20.0
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
    offload_config:
      enable_activation: false
      activation_gpu_limit: 0.0

  optimizer:
    type: adamw
    lr: 1.0e-5
    lr_min: 1.0e-7
    lr_start: 0.0
    lr_warmup_ratio: 0.0
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    weight_decay: 0.0
    max_grad_norm: 1.0
    no_decay_params: []
    no_decay_modules: []

data:
  data_type: seedomni
  max_seq_len: 4096
  train_path: configs/seed_omni/Llada2_uni/data.yaml
  datasets_type: iterable
  multisource_datasets_type: veomni_weighted_multisource
  train_sample: 1000000
  dataloader:
    type: native
    num_workers: 4
    drop_last: true
    pin_memory: true
    prefetch_factor: 2

train:
  seed: 42
  num_train_epochs: 1
  global_batch_size: 32
  micro_batch_size: 1
  dyn_bsz: false

  checkpoint:
    output_dir: outputs/llada2_uni_16b_omni_sft
    save_steps: 500
    save_epochs: 0
    save_hf_weights: true
    hf_save_steps: 500
    hf_save_epochs: 0
  wandb:
    enable: true
    project: VeOmni_omni
    name: llada2_uni_16b_omni_sft

infer:
  generation_kwargs:
    max_new_tokens: 512
    gen_length: 128
    diffusion_steps: 128
    temperature: 0.0
    do_sample: false
    remasking: low_confidence
