# Speech output, single-process eager. Paired with `graph.yaml` in this
# directory: thinker text AR -> talker RVQ codes -> waveform.
#
# A sibling of `../thinker_only/modules.yaml` rather than a shared base:
# `model_config.modules` takes one path and is applied whole, with no overlay, so
# the two inference recipes cannot share a file. The intended difference is the
# `qwen3omni_text_encoder` block below — speech output needs the system turn, and
# the text-only recipe must not have it.
#
# Single-process eager inference: no FSDP wrap, plain HF load on one device.
#
# The 30B-A3B weights fit on one H20. Keep it to one device: the talker's
# sampling loop mixes `pad_token_id` with `next_tokens` without a device cast,
# so an "auto" split across GPUs dies on a cuda:0/cuda:N mismatch.
qwen3omni_audio:
  model_path: qwen3omni_audio
  accelerator:
    fsdp_config:
      fsdp_mode: eager
qwen3omni_vision:
  model_path: qwen3omni_vision
  accelerator:
    fsdp_config:
      fsdp_mode: eager
qwen3omni_text_encoder:
  model_path: qwen3omni_text_encoder
  # Speech output needs this turn or the thinker answers in numbered prose that
  # never reaches `<|im_end|>` within the token budget, so the FSM never hands
  # over to the talker and no audio comes out. Set per recipe, not in the
  # checkpoint: `../thinker_only/modules.yaml` leaves it off, since the 50-word
  # cap and voice persona would skew a text evaluation.
  model_config:
    add_speech_system_prompt: true
  accelerator:
    gradient_checkpointing:
      enable: false
    fsdp_config:
      fsdp_mode: eager
qwen3omni_llm:
  model_path: qwen3omni_llm
  # The talker reads an interior thinker layer, so the backbone has to keep the
  # whole layer stack. Set here rather than in the checkpoint because it is a
  # property of the graph this recipe serves; the text-only recipe leaves it off.
  model_config:
    collect_thinker_states: true
  accelerator:
    fsdp_config:
      fsdp_mode: eager
qwen3omni_talker:
  model_path: qwen3omni_talker
  accelerator:
    fsdp_config:
      fsdp_mode: eager
qwen3omni_codec:
  model_path: qwen3omni_codec
  accelerator:
    fsdp_config:
      fsdp_mode: eager
