# VeOmni training / inference config for OmniModel — Qwen3-MoE.
#
# The config is size-agnostic: which Qwen3-MoE checkpoint you point at decides
# the parameter count (Qwen3-30B-A3B, Qwen3-235B-A22B, ... all share this graph).
#
# Launch training:
#   bash train.sh tasks/omni/train_omni.py configs/seed_omni/Qwen/moe/train/base.yaml
#
# Launch inference (text-only chat):
#   bash train.sh tasks/omni/infer_omni.py configs/seed_omni/Qwen/moe/train/base.yaml \
#     --infer.prompt "What is 2+2?" \
#     --infer.output_dir qwen3_moe_out
#
# Prerequisite — split the upstream Qwen3-MoE checkpoint. This recipe enables
# `ep_sharded_stream_load` on the backbone (see `train/modules_train.yaml`), which
# needs the split layout: an upstream root is loaded through the `qwen3_moe` HF
# layout, and that path rejects streaming because it cannot apply the layout's key
# renames.
#   python scripts/seed_omni/convert_model.py \
#     --model_path Qwen3-MoE \
#     --output_dir Qwen3-MoE-split
#
# The upstream root does work as `model_path` — `qwen3_moe/hf_layout.py` registers
# a `qwen3_moe` layout, so no offline split is needed — but then you must also pass
# `--model.model_config.modules` pointing at an overlay with
# `ep_sharded_stream_load: false` (and `broadcast_model_weights_from_rank0: true`).
# Streaming cannot apply the layout's key renames, so the parser refuses that
# combination at startup. HF export works either way: the layout splits the fused
# expert tensors back to per-expert keys on the way out.
#
# `model_path` and `data.yaml`'s `sources` are placeholders: replace them with
# absolute paths this job can read before training.

model:
  model_path: Qwen3-MoE-split
  model_config:
    modules: configs/seed_omni/Qwen/moe/train/modules_train.yaml
    train_graph: configs/seed_omni/Qwen/moe/train/graph_train.yaml
    infer_graph:
      infer_text: configs/seed_omni/Qwen/moe/train/graph_infer.yaml
  ops_implementation:
    attn_implementation: flash_attention_2
    # ``moe_implementation`` is deliberately left unset: each host then takes its
    # own default (``fused_triton`` on CUDA/MLU, ``fused_npu`` on Ascend), whereas
    # naming ``fused_triton`` here would fail argument parsing on NPU
    # (``_NPU_ALLOWED["moe_implementation"]``).

  accelerator:
    init_device: meta
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      reshard_after_forward: true
      reshard_after_backward: true
      forward_prefetch: true
      offload: false
      max_load_broadcast_size: 20.0
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
    offload_config:
      enable_activation: false
      activation_gpu_limit: 0.0

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 1.0e-6
    lr_start: 0.0
    lr_warmup_ratio: 0.03
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    weight_decay: 0.01
    max_grad_norm: 1.0
    no_decay_params: []
    no_decay_modules: []

data:
  data_type: seedomni
  max_seq_len: 4096
  train_path: configs/seed_omni/Qwen/moe/train/data.yaml
  datasets_type: iterable
  multisource_datasets_type: veomni_weighted_multisource
  train_sample: 1000000
  dataloader:
    type: native
    num_workers: 4
    drop_last: true
    pin_memory: true
    prefetch_factor: 2

train:
  seed: 42
  num_train_epochs: 1
  # A large MoE: keep the micro batch at 1; global_batch_size must be a multiple
  # of the global dp_size (= world_size, since the top-level accelerator has no
  # EP). See docs/seed_omni/models/qwen3_moe.md §3 before raising the world size.
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false

  checkpoint:
    output_dir: outputs/moe_omni_sft
    save_steps: 500
    save_epochs: 0
    save_hf_weights: true
    hf_save_steps: 500
    hf_save_epochs: 0
  wandb:
    enable: true
    project: VeOmni_omni
    name: moe_omni_sft

infer:
  # For distributed FSDP2 + Expert Parallel inference (torchrun), override with
  # `--model.model_config.modules configs/seed_omni/Qwen/moe/infer/modules_infer_fsdp.yaml`.
  generation_kwargs:
    max_new_tokens: 2048
    temperature: 0.0
    top_p: 1.0
    do_sample: false
