# Qwen3-0.6B visual instruction tuning — image understanding SFT (I2T).
#
# Flat list of edges; each endpoint is a self-describing `module[.method]`
# string (bare module -> `.forward`). Active nodes derived from endpoints:
#
#   {qwen3vl_vision, qwen3_text_encoder.encode}
#       -> qwen3_llm -> qwen3_text_encoder.decode -> end
#
# The two contributors are ordinary modules from two different families —
# `qwen3vl_vision` from the Qwen3-VL PR, `qwen3_text_encoder` / `qwen3_llm` from
# the Qwen3 PR — composed by this YAML alone. `qwen3_text_encoder` runs in image
# mode (`model_config.enable_image: true`), so it uses the Qwen3-VL chat template
# and accepts the vision rows the tower writes onto the carrier.
- { from: qwen3vl_vision,             to: qwen3_llm }                      # image embeds -> carrier
- { from: qwen3_text_encoder.encode,  to: qwen3_llm }                      # chat-template tokenise + wte
- { from: qwen3_llm,                  to: qwen3_text_encoder.decode }      # text CE head
- { from: qwen3_text_encoder.decode,  to: end }
