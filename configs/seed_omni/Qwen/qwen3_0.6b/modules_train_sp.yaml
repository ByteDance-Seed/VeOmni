# Per-module SP for Qwen3-0.6B (text-only): backbone LLM SP=4, the wte /
# text-encoder stays UNsharded — i.e. "only the LLM does SP".
#
# The outer (orchestrator) trainer ALWAYS runs with SP disabled (ulysses_size=1);
# SP is declared PER MODULE. Each rank loads its own DP shard.
#
# Topology:
#   * outer trainer      : ulysses_size = 1   (enforced; do NOT pass --accelerator.ulysses_size)
#   * qwen3_llm          : ulysses_size = 4   (module SP)
#   * qwen3_text_encoder : ulysses_size = 1   (no SP; wte NOT sequence-sharded)
#
# qwen3_llm's 4-rank SP group each holds a distinct per-rank sequence, so
# forward_pre aggregates them (sp_gather_seqs), slices across SP=4, and
# forward_post narrows the output back per-rank (sp_take_own_seq). Only the AR
# backbone shards its sequence; the embedding lookup runs full on every rank.
#
# World-size rule: world % 4 == 0 (module_sp = 4).
#
# Launch (4 GPUs, global_batch_size 16, micro_batch_size 4):
#   NPROC_PER_NODE=4 bash train.sh tasks/omni/train_omni.py \
#     configs/seed_omni/Qwen/qwen3_0.6b/base.yaml \
#     --model.modules configs/seed_omni/Qwen/qwen3_0.6b/modules_train_sp.yaml \
#     --train.global_batch_size 16 --train.micro_batch_size 4 --train.max_steps 20
qwen3_text_encoder:
  model:
    model_path: qwen3_text_encoder

qwen3_llm:
  model:
    model_path: qwen3_llm

  accelerator:
    ulysses_size: 4
