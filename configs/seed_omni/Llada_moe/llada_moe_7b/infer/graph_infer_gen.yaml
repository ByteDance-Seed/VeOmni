# LLaDA-MoE generation FSM -- placeholder for the training-only phase.
#
# `OmniArguments` requires an `infer_graph` even for a training-only launch, and
# this module does not implement a mask-predictor `generate` yet.
#
# `LladaMoeOmni` inherits `LLaDAMoEForCausalLM`, so `generate` resolves to the
# vendored autoregressive one, which is NOT the low-confidence remasking this
# model needs. Until that is implemented, inference through this graph produces
# decoded text from the stock generator and must not be treated as a validated
# result. The single state exists so a launcher parses; it is not a contract.
initial: run

states:
  run:
    body:
      - { from: llada_moe_omni, to: end }
    transitions:
      - { condition: { type: default }, next_state: done }
