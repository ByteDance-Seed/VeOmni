# Per-module SP smoke for Janus-1.3B: outer SP=1, LLM backbone SP=4.
#
# The outer (orchestrator) trainer always runs with SP disabled (ulysses_size=1) —
# it does no per-token sequence compute, so SP is declared PER MODULE. Each rank
# loads its own DP shard; a module with ulysses_size > 1 gathers its SP group's
# distinct per-rank sequences (sp_gather_seqs), slices across its SP, and
# narrows the output back per-rank (sp_take_own_seq).
#
# Topology:
#   * outer trainer  : ulysses_size = 1   (enforced; do NOT pass --accelerator.ulysses_size)
#   * janus_llama     : ulysses_size = 4  (module SP)
#   * others          : ulysses_size = 1  (no SP)
#
# World-size rules:
#   * world % 4 == 0                (module_sp = 4)
#   * world % emb == 0              (text_encoder emb-parallel = 4 -> world % 4 == 0)
# => run on 4 GPUs (dp: llama=1, others=4). Scale to 8 GPUs for dp=2 on llama.
#
# Launch (4 GPUs, global_batch_size 4):
#   NPROC_PER_NODE=4 bash train.sh tasks/omni/train_omni.py \
#     configs/seed_omni/Janus/janus_1.3b/base.yaml \
#     --model.modules configs/seed_omni/Janus/janus_1.3b/modules_train_sp.yaml \
#     --train.global_batch_size 4 --train.micro_batch_size 1 --train.max_steps 5 \
#     --train.wandb.enable false \
#     --train.checkpoint.save_steps 100000000 --train.checkpoint.save_epochs 0 \
#     --train.checkpoint.hf_save_steps 100000000 --train.checkpoint.hf_save_epochs 0
janus_siglip:
  model:
    model_path: janus_siglip

  accelerator:
    fsdp_config:
      fsdp_mode: ddp

janus_vqvae:
  model:
    model_path: janus_vqvae

    ops_implementation:
      attn_implementation: eager

janus_text_encoder:
  model:
    model_path: janus_text_encoder

  accelerator:
    extra_parallel_sizes: [4]
    extra_parallel_names: ["emb"]
    extra_parallel_placement_innermost: [false]

janus_llama:
  model:
    model_path: janus_llama
    ops_implementation:
      attn_implementation: flash_attention_2

  accelerator:
    ulysses_size: 4
    fsdp_config:
      fsdp_mode: fsdp2
