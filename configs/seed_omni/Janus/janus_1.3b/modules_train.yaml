janus_siglip:
  model_path: janus_siglip
  accelerator:
    fsdp_config:
      fsdp_mode: ddp

janus_vqvae:
  model_path: janus_vqvae
  ops_implementation:
    attn_implementation: eager

janus_text_encoder:
  model_path: janus_text_encoder
  accelerator:
    extra_parallel_sizes: [4]
    extra_parallel_names: ["emb"]
    extra_parallel_placement_innermost: [false]

janus_llama:
  model_path: janus_llama
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    fsdp_config:
      fsdp_mode: fsdp2
