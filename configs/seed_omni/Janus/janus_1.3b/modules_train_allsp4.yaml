# Whole-model SP smoke for Janus-1.3B: EVERY module runs Ulysses SP=4.
#
# This reproduces VeOmni's original "whole model shares one SP size" behavior
# (the wte/text-encoder is sequence-sharded too), so it can be compared against
# the per-module SP feature (e.g. modules_train_sp.yaml = only the backbone SP4).
#
# The outer (orchestrator) trainer ALWAYS runs with SP disabled (ulysses_size=1);
# SP is declared PER MODULE. Each rank loads its own DP shard.
#
# Topology:
#   * outer trainer : ulysses_size = 1   (enforced; do NOT pass --accelerator.ulysses_size)
#   * every module  : ulysses_size = 4   (module SP)
#
# NOTE: the text encoder drops its `emb` extra-parallel here — `emb=4` and
# `ulysses=4` are independent mesh dims (world % (emb*ulysses) == 0), so both
# at 4 would need 16 GPUs. Whole-model SP shards the sequence (not the vocab),
# so SP4 alone is the faithful comparison point.
#
# Launch (4 GPUs, global_batch_size 16, micro_batch_size 4):
#   NPROC_PER_NODE=4 bash train.sh tasks/omni/train_omni.py \
#     configs/seed_omni/Janus/janus_1.3b/base.yaml \
#     --model.modules configs/seed_omni/Janus/janus_1.3b/modules_train_allsp4.yaml \
#     --train.global_batch_size 16 --train.micro_batch_size 4 --train.max_steps 20
janus_siglip:
  model:
    model_path: janus_siglip

  accelerator:
    ulysses_size: 4
    fsdp_config:
      fsdp_mode: ddp

janus_vqvae:
  model:
    model_path: janus_vqvae

    ops_implementation:
      attn_implementation: eager

  accelerator:
    ulysses_size: 4

janus_text_encoder:
  model:
    model_path: janus_text_encoder

  accelerator:
    ulysses_size: 4

janus_llama:
  model:
    model_path: janus_llama
    ops_implementation:
      attn_implementation: flash_attention_2

  accelerator:
    ulysses_size: 4
    fsdp_config:
      fsdp_mode: fsdp2
