# Cosmos3-Nano has no SeedOmni sampler yet. The launcher requires a generation
# graph for every model, so this one exists only to satisfy it: running it raises
# NotImplementedError from cosmos3_flow_connector.generate.
initial: unsupported

states:
  unsupported:
    body:
      - { from: cosmos3_flow_connector, to: end }
    transitions:
      - { condition: { type: default }, next_state: done }
