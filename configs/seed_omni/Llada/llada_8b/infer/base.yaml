# LLaDA-8B inference: low-confidence remasking, one module.
#
#   bash train.sh tasks/omni/infer_omni.py configs/seed_omni/Llada/llada_8b/infer/base.yaml \
#     --model.model_path /path/to/LLaDA-8B-Instruct-veomni \
#     --infer.prompt "The capital of France is"
#
# `gen_length` is the answer budget and `diffusion_steps` the number of denoising
# passes inside the module; they are independent of the framework's
# `max_new_tokens`, which bounds FSM passes and must be at least
# `diffusion_steps` (plus one for the pass that lays out the prompt).
model:
  model_path: LLaDA-8B-Instruct-veomni
  model_config:
    modules: configs/seed_omni/Llada/llada_8b/infer/modules_infer.yaml
    chat_template: llada
    max_seq_len: 2048
    text_keys: messages
    infer_graph:
      infer_gen: configs/seed_omni/Llada/llada_8b/infer/graph_infer_gen.yaml
    infer_type: infer_gen
  ops_implementation:
    attn_implementation: flash_attention_2

# `OmniArguments` requires a data block even for a generation-only launch;
# nothing under it is read on this path.
data:
  data_type: seedomni
  train_path: /mnt/hdfs/user_dir/text_diff/data/sudoku/train.jsonl
  datasets_type: mapping
  source_name: tulu-3-sft-mixture
  max_seq_len: 2048
  dataloader:
    type: native
    num_workers: 0

infer:
  output_dir: /tmp/omni_llada8b_infer
  generation_kwargs:
    gen_length: 128
    diffusion_steps: 64
    # FSM passes, not tokens: one to lay out the prompt plus one per denoising
    # step. Below `diffusion_steps` the run is cut short and `finalize` emits a
    # truncated answer.
    max_new_tokens: 128
