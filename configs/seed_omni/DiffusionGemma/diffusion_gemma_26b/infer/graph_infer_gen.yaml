# DiffusionGemma generation FSM: one node, one pass.
#
# Block diffusion is not a per-token loop. `diffusion_gemma_omni.generate` calls
# `block_autoregressive_generate`, which prefills the prompt into a KV cache, denoises
# a whole canvas against it, re-encodes that canvas back into the cache (Equation 4),
# and repeats until an end-of-turn token or `max_blocks`. The canvas cache lives inside
# that call, so there is no state to carry between FSM passes and the graph is a single
# node that emits `text_done` immediately.
#
# The budgets are the sampler's, not the framework's: `num_steps` caps denoising steps
# per canvas, `max_blocks` caps canvases, and `max_new_tokens` here only has to be
# large enough to admit the single pass.
initial: generate

states:
  generate:
    body:
      - { from: diffusion_gemma_omni, to: end }
    transitions:
      - { condition: { type: module_signal, key: text_done }, next_state: done }
      - { condition: { type: default }, next_state: done }
