# DeepSeek-V4.1-Flash training DAG without n-gram and MTP (vision + text_encoder + llm).
#
#   {deepseek_v41_vision, deepseek_v41_text_encoder.encode}
#       -> deepseek_v41_llm -> deepseek_v41_text_encoder.decode -> end
#
# When switching a config to this graph, set on `deepseek_v41_llm`:
#   engram_layer_ids: []
#   emit_draft_hiddens: false
#   dspark_block_size: 0
# and on `deepseek_v41_text_encoder`:
#   dspark_block_size: 0
- { from: deepseek_v41_vision,              to: deepseek_v41_llm }
- { from: deepseek_v41_text_encoder.encode, to: deepseek_v41_llm }
- { from: deepseek_v41_llm,                 to: deepseek_v41_text_encoder.decode }
- { from: deepseek_v41_text_encoder.decode, to: end }
