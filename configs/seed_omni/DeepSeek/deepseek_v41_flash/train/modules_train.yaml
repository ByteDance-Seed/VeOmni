# Per-module overrides for DeepSeek-V4.1-Flash. Sizes and the parallelism each
# one needs differ by two orders of magnitude across these four, so almost
# nothing here is shareable with the top-level accelerator.
#
#   vision          0.49 B   FSDP2 alone
#   text_encoder    1.32 B   emb   (vocab-parallel wte + CE head)
#   ngram         196.61 B   emb   (row-sharded tables, frozen)
#   llm           550.56 B   ep    (543.4 B of it is routed experts)
#
# The `emb` group size must match across `ngram` and `text_encoder` only in the
# sense that each is sized to its own table; they are separate meshes.

deepseek_v41_vision:
  model_path: deepseek_v41_vision
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    fsdp_config:
      fsdp_mode: fsdp2

deepseek_v41_text_encoder:
  model_path: deepseek_v41_text_encoder
  accelerator:
    extra_parallel_sizes: [8]
    extra_parallel_names: ["emb"]
    extra_parallel_placement_innermost: [false]
    gradient_checkpointing:
      enable: false

deepseek_v41_ngram:
  model_path: deepseek_v41_ngram
  model_config:
    # G1: full-parameter training with the tables frozen. This is honoured by
    # `DeepseekV41Ngram.freeze_model`; without that method the field would be
    # accepted and ignored, and AdamW would allocate moments for 196.6 B rows.
    freeze: true
  accelerator:
    # Row-sharded over 8 ranks -> ~23.6 GiB each in the released fp8. The lookup
    # is an all-to-all gather, bit-identical to the full-table result.
    extra_parallel_sizes: [8]
    extra_parallel_names: ["emb"]
    extra_parallel_placement_innermost: [false]
    gradient_checkpointing:
      enable: false

deepseek_v41_llm:
  model_path: deepseek_v41_llm
  model_config:
    # Checkpoint files stay fp8/fp4. Clearing this makes the module allocate
    # bf16 Parameters; DeepseekV41DequantConverter spends the scales at load.
    weight_quantization: null
    # Indexer weights only get a gradient through this KL -- top-k does not
    # backprop into the scores. Off, the indexer is frozen in all but name.
    dsa_indexer_loss: true
    # DSpark is serving-only; skip the 14B draft stack so training fits.
    dspark_block_size: 0
    # 8xH20 cannot hold AdamW moments for 40 layers of experts. First two stay
    # full-param bf16; ``DeepseekV41Llm.freeze_model`` freezes the rest.
    n_trainable_layers: 2
  ops_implementation:
    # Fake-quant dense GEMMs to fp8 and routed experts to fp4 (`expert_dtype`).
    # Needs SM90+ (the 8xH20 job); `none` trains in bf16 with no rounding.
    # Bound through the slots re-exported on the llm accelerated module --
    # without those, this field is accepted and the helpers stay off.
    qat_implementation: fp8_blockwise
  accelerator:
    ep_size: 8
    ep_outside: false
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
