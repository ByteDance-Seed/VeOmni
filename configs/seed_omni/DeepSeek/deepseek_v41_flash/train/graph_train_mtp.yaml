# DeepSeek-V4.1-Flash training DAG — text + image understanding SFT with DSpark / MTP.
#
# Extends `graph_train.yaml` with the standalone `deepseek_v41_mtp` node between
# `deepseek_v41_llm` and `deepseek_v41_text_encoder.decode`:
#
#   deepseek_v41_vision -> deepseek_v41_ngram
#   {deepseek_v41_ngram, deepseek_v41_text_encoder.encode}
#       -> deepseek_v41_llm -> deepseek_v41_mtp -> deepseek_v41_text_encoder.decode -> end
#
# Requires `emit_draft_hiddens: true` on `deepseek_v41_llm` so the backbone
# captures its target-layer hidden states and hands them to `deepseek_v41_mtp`
# zero-copy. Runs that do not train MTP should use `graph_train.yaml` instead.
- { from: deepseek_v41_vision,              to: deepseek_v41_ngram }   # image embeds size the spans
- { from: deepseek_v41_ngram,               to: deepseek_v41_llm }     # hash + gather the two tables
- { from: deepseek_v41_text_encoder.encode, to: deepseek_v41_llm }     # chat-template tokenise + wte
- { from: deepseek_v41_llm,                 to: deepseek_v41_mtp }     # zero-copy draft_hiddens handoff
- { from: deepseek_v41_mtp,                 to: deepseek_v41_text_encoder.decode }  # text + DSpark CE head
- { from: deepseek_v41_text_encoder.decode, to: end }
