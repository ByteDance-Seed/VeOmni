# GLM-5.3-Flash VLM SFT (eager-first). Point model_path at a BF16 (or
# dequantized) checkpoint; official HF releases ship FP8 and need conversion.
#
# Text Ulysses SP uses gather-before-attn around HF KDA/DSA. Vision SP uses
# VeomniOp attention's internal Ulysses path. Use a multimodal chat template
# (qwen3vl) so VeOmni's IMAGE/VIDEO_INPUT_INDEX placeholders are emitted;
# there is no native GLM multimodal chat template in VeOmni yet.
#
# Packed multi-sample dyn_bsz is NOT supported yet (KDA recurrent state + DSA
# visibility ignore pack boundaries). Keep train.dyn_bsz=false for bring-up.

model:
  # model_path: /path/to/GLM-5.3-Flash-bf16
  ops_implementation:
    attn_implementation: eager
    moe_implementation: eager
    cross_entropy_loss_implementation: chunk_loss
    rms_norm_implementation: eager
    gated_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    rotary_pos_emb_vision_implementation: eager
    load_balancing_loss_implementation: eager
  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_decay_style: cosine
    max_grad_norm: 1.0
  accelerator:
    gradient_checkpointing:
      enable: true
    init_device: meta
    ulysses_size: 1
    ep_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
  chat_template: qwen3vl

data:
  train_path: your_vlm_dataset
  data_type: conversation
  max_seq_len: 4096
  train_size: 100000
  text_keys: messages
  dyn_bsz_buffer_size: 200

train:
  # See file header: packing / dyn_bsz multi-sample is unsupported for KDA+DSA.
  dyn_bsz: false
  global_batch_size: 8
  micro_batch_size: 1
  bsz_warmup_ratio: 0.007
  num_train_epochs: 1
  enable_full_determinism: false
  empty_cache_steps: 500
  checkpoint:
    output_dir: glm5-next-flash-vlm-sft
    manager: dcp
    save_steps: 0
    save_epochs: 1
    save_hf_weights: true
  wandb:
    project: VeOmni
    name: glm5-next-flash-vlm-sft
