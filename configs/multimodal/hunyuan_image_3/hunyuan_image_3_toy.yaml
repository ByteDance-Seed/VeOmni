# HunyuanImage 3 toy end-to-end config (online VAE encode).
#
# Drives tasks/train_vlm.py + VLMTrainer over the tiny tests/toy_config model.
# ``data.train_path`` and ``train.checkpoint.output_dir`` are provided on the CLI.
# Single-GPU: init_device=cuda + mixed_precision.enable=false keeps params in bf16
# (the flash-attention GCA path needs bf16) without FSDP.
model:
  config_path: tests/toy_config/hunyuan_image_3_toy
  ops_implementation:
    attn_implementation: flash_attention_2
    moe_implementation: eager
  # Training recipe, overlaid onto the model config at build. Only deviations
  # from the defaults need listing; see component_policy.py (lifecycle) and
  # veomni/schedulers/flow_matching.py DEFAULT_REFERENCE_FLOW_CONFIG (objective).
  model_config:
    component_policy:
      vae_encoder: frozen
    flow:
      num_train_timesteps: 1000
      timestep_sampling: uniform
      training_shift: 1.0
      prediction_type: velocity
      loss_weighting: uniform

data:
  train_path: PLACEHOLDER_SET_ON_CLI
  datasets_type: mapping
  data_type: conversation
  text_keys: prompt
  max_seq_len: 128
  dataloader:
    num_workers: 0
  mm_configs:
    target_image_key: image
    prompt_dropout_prob: 0.0
    # The toy VAE has ffactor_spatial=1 and patch_size=1, so 2x2 pixels
    # round-trip to a 2x2 latent grid that matches the sequence plan.
    resolution: [2, 2]

train:
  dyn_bsz: false
  micro_batch_size: 1
  global_batch_size: 1
  bsz_warmup_ratio: 0
  num_train_epochs: 2
  max_steps: 5
  init_device: cuda
  accelerator:
    fsdp_config:
      fsdp_mode: ddp
      mixed_precision:
        enable: false
  optimizer:
    lr: 1.0e-4
  checkpoint:
    output_dir: PLACEHOLDER_SET_ON_CLI
    save_steps: 1000000
  wandb:
    enable: false
