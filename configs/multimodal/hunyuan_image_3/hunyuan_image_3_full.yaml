# HunyuanImage 3 text-to-image full fine-tune recipe.
#
# Illustrative recipe for tasks/train_vlm.py + VLMTrainer. Paths and sizes are
# placeholders, not performance commitments; tune per target cluster. The online
# VAE encode path runs in FP32.
model:
  model_path: /path/to/tencent/HunyuanImage-3.0
  tokenizer_path: /path/to/tencent/HunyuanImage-3.0
  config_path: configs/model_configs/hunyuan_image_3/HunyuanImage3Base.json
  ops_implementation:
    attn_implementation: flash_attention_2
    moe_implementation: fused_triton
  # Training recipe, overlaid onto the model config at build. Only deviations
  # from the defaults need listing; see component_policy.py (lifecycle) and
  # veomni/schedulers/flow_matching.py DEFAULT_REFERENCE_FLOW_CONFIG (objective).
  model_config:
    component_policy:
      vae_encoder: frozen
    flow:
      num_train_timesteps: 1000
      timestep_sampling: uniform
      training_shift: 1.0
      prediction_type: velocity
      loss_weighting: uniform
      # Base seed for the flow noise stream. Lives on the recipe (and so in
      # the checkpoint's config.json), independent of train.seed.
      seed: 0

data:
  train_path: /path/to/training-data
  datasets_type: mapping
  data_type: conversation
  text_keys: prompt
  max_seq_len: 8192
  dataloader:
    num_workers: 8
  mm_configs:
    target_image_key: image
    # Single fixed CenterCrop resolution (height, width). Every online sample is
    # aspect-fill resized then centered-cropped to this size before the VAE
    # encode -- byte-identical to mainline Text2ImageDataset.
    resolution: [1024, 1024]
    prompt_dropout_prob: 0.1

train:
  dyn_bsz: false
  # Every online micro-batch shares one (C, H, W) so mbs>1 is safe end-to-end;
  # bump if per-sample memory allows for better throughput.
  micro_batch_size: 1
  global_batch_size: 8
  init_device: meta
  num_train_epochs: 1
  max_steps: 1000
  accelerator:
    # Ulysses SP costs throughput here (one all-to-all pair per attention call,
    # and the 1024px sequence already fits) -- raise it only to relieve memory.
    ulysses_size: 1
    ep_size: 8
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  optimizer:
    type: adamw
    lr: 1.0e-5
  checkpoint:
    output_dir: hunyuan_image_3_full
