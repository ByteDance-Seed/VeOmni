# hf download ByteDance-Seed/Seed-OSS-36B-Base --local-dir ./Seed-OSS-36B-Base
# Preparation: docs/examples/seed_oss.md
# bash train.sh tasks/train_text.py configs/models/seed_oss/ascend.yaml

model:
  model_path: ./Seed-OSS-36B-Base
  optimizer:
    lr: 0.0003
    lr_warmup_ratio: 0.007
    lr_decay_style: constant
    lr_decay_ratio: 1.0
    weight_decay: 0.01
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  lora_config:
    rank: 8
    alpha: 16
    lora_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
data:
  train_path: ./data/text.parquet
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
train:
  global_batch_size: 8
  micro_batch_size: 1
  bsz_warmup_ratio: 0.007
  checkpoint:
    output_dir: outputs/seed_oss/ascend
    manager: dcp
    save_hf_weights: false
  wandb:
    enable: false
  num_train_epochs: 1
  dyn_bsz: false
