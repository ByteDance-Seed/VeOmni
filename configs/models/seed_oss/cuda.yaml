# Seed-OSS-36B-Base on 8 × H20.
# NPROC_PER_NODE=8 bash train.sh tasks/train_text.py configs/models/seed_oss/cuda.yaml
model:
  model_path: ./Seed-OSS-36B-Base
  optimizer:
    lr: 0.0003
    lr_warmup_ratio: 0.007
    lr_decay_style: constant
    lr_decay_ratio: 1.0
    weight_decay: 0.01
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  lora_config:
    rank: 8
    alpha: 16
    lora_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
data:
  train_path: ./data/text.parquet
  dataloader:
    num_workers: 0
  datasets_type: mapping
  data_type: plaintext
  max_seq_len: 1024
  text_keys: text
train:
  global_batch_size: 8
  micro_batch_size: 1
  bsz_warmup_ratio: 0.007
  checkpoint:
    output_dir: outputs/seed_oss/cuda
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
  max_steps: 3
  num_train_epochs: 1
  profile:
    enable: false
  dyn_bsz: false
