# hf download Qwen/Qwen3-0.6B --local-dir ./Qwen3-0.6B
# Preparation: docs/examples/qwen3.md
# bash train.sh tasks/train_text.py configs/models/qwen3/cuda.yaml

model:
  model_path: ./Qwen3-0.6B
  chat_template: chatml
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  optimizer:
    type: adamw
    lr: 1.0e-4

data:
  train_path: tulu-first2000.parquet
  data_type: conversation
  text_keys: messages
  max_seq_len: 2048

train:
  dyn_bsz: false
  global_batch_size: 8
  micro_batch_size: 1
  num_train_epochs: 1
  checkpoint:
    output_dir: outputs/qwen3/cuda
    save_hf_weights: false
