# BAGEL-7B-MoT on 8 × H20.
# NPROC_PER_NODE=8 bash train.sh tasks/omni/train_omni.py configs/models/bagel/cuda.yaml
model:
  model_path: ./BAGEL-7B-MoT
  model_config:
    modules: configs/seed_omni/Bagel/bagel_7b_mot/train/modules_train.yaml
    train_graph: configs/seed_omni/Bagel/bagel_7b_mot/train/graph_train.yaml
    infer_graph:
      infer_edit: configs/seed_omni/Bagel/bagel_7b_mot/infer/graph_infer_edit.yaml
      infer_gen: configs/seed_omni/Bagel/bagel_7b_mot/infer/graph_infer_gen.yaml
      infer_und: configs/seed_omni/Bagel/bagel_7b_mot/infer/graph_infer_und.yaml
    infer_type: infer_und
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    init_device: meta
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      reshard_after_forward: true
      reshard_after_backward: true
      forward_prefetch: true
      offload: false
      max_load_broadcast_size: 20.0
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
    offload_config:
      enable_activation: false
      activation_gpu_limit: 0.0
  optimizer:
    type: adamw
    lr: 0.0001
    lr_min: 1.0e-06
    lr_start: 0.0
    lr_warmup_ratio: 0.03
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    weight_decay: 0.01
    max_grad_norm: 1.0
    no_decay_params: []
    no_decay_modules: []
data:
  data_type: seedomni
  max_seq_len: 4096
  train_path: ./data/sharegpt4v.parquet
  datasets_type: mapping
  multisource_datasets_type: veomni_weighted_multisource
  train_sample: 1000000
  dataloader:
    num_workers: 0
  source_name: sharegpt4v_sft
train:
  seed: 42
  num_train_epochs: 1
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  checkpoint:
    output_dir: outputs/bagel/cuda
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
  max_steps: 3
  profile:
    enable: false
