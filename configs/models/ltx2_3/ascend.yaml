# hf download Lightricks/LTX-2.3 ltx-2.3-22b-dev.safetensors --local-dir ./LTX-2.3
# ln -s ltx-2.3-22b-dev.safetensors ./LTX-2.3/model.safetensors
# cp configs/model_configs/ltx2_3/ltx2_3_av.json ./LTX-2.3/config.json
# Preparation: docs/examples/ltx-2.3.md
# bash train.sh tasks/train_dit.py configs/models/ltx2_3/ascend.yaml

model:
  model_path: ./LTX-2.3
  condition_model_path: ./LTX-2.3
  config_path: configs/model_configs/ltx2_3/ltx2_3_av.json
  condition_model_cfg:
    with_audio: true
    first_frame_conditioning_p: 0.5
    timestep_sampling_mode: shifted_logit_normal
  lora_config:
    rank: 4
    alpha: 8
    lora_modules:
    - to_k
    - to_v
    - to_out.0
  ops_implementation:
    attn_implementation: sdpa
    rotary_pos_emb_implementation: eager
    rms_norm_implementation: eager
    gated_mlp_implementation: eager
    cross_entropy_loss_implementation: eager
    moe_implementation: eager
    load_balancing_loss_implementation: eager
  optimizer:
    type: adamw
    lr: 0.0001
    lr_decay_style: linear
    lr_min: 1.0e-05
    lr_warmup_ratio: 0.0
    weight_decay: 0.01
    max_grad_norm: 1.0
  accelerator:
    init_device: meta
    gradient_checkpointing:
      enable: true
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
      offload: true
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        cast_forward_inputs: false
    offload_config:
      enable_activation: true
      activation_gpu_limit: 2.0
data:
  train_path: ./data/ltx_latents.parquet
  data_type: diffusion
  datasets_type: mapping
  text_keys: text
  max_seq_len: 8192
  data_transform: dit_offline
train:
  training_task: offline_training
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  seed: 42
  num_train_epochs: 1
  checkpoint:
    output_dir: outputs/ltx2_3/ascend
    manager: dcp
    save_hf_weights: false
  wandb:
    enable: false
