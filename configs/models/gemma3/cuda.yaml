# Reduced-model check for Gemma 3 on 8 × H20.
# NPROC_PER_NODE=8 bash train.sh tasks/train_text.py configs/models/gemma3/cuda.yaml
model:
  chat_template: chatml
  ops_implementation:
    attn_implementation: eager
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  optimizer:
    type: adamw
    lr: 0.0001
  config_path: tests/toy_config/gemma3_toy
  tokenizer_path: configs/models/_fixtures/text_tokenizer
data:
  train_path: ./data/text.parquet
  data_type: plaintext
  text_keys: text
  max_seq_len: 128
  datasets_type: mapping
  dataloader:
    num_workers: 0
train:
  dyn_bsz: false
  global_batch_size: 8
  micro_batch_size: 1
  num_train_epochs: 1
  checkpoint:
    output_dir: outputs/gemma3/cuda
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  max_steps: 3
  wandb:
    enable: false
  profile:
    enable: false
