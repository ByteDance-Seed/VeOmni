# Qwen3-VL-2B image SFT on NVIDIA CUDA. See docs/examples/qwen3_vl.md.
model:
  model_path: ./Qwen3-VL-2B-Instruct
  chat_template: qwen3vl
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  optimizer:
    type: adamw
    lr: 1.0e-5

data:
  train_path: sharegpt4v_instruct_gpt4-vision_cap100k_coco.json
  data_type: conversation
  source_name: sharegpt4v_sft
  max_seq_len: 4096
  mm_configs:
    image_max_pixels: 602112

train:
  dyn_bsz: false
  freeze_vit: false
  global_batch_size: 8
  micro_batch_size: 1
  num_train_epochs: 1
  checkpoint:
    output_dir: outputs/qwen3_vl/cuda
    save_hf_weights: false
