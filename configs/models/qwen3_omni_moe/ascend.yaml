# hf download Qwen/Qwen3-Omni-30B-A3B-Instruct --local-dir ./Qwen3-Omni-30B-A3B-Instruct
# Preparation: docs/examples/qwen3_omni_moe.md
# bash train.sh tasks/train_vlm.py configs/models/qwen3_omni_moe/ascend.yaml

model:
  model_path: ./Qwen3-Omni-30B-A3B-Instruct
  ops_implementation:
    moe_implementation: fused_npu
    attn_implementation: flash_attention_2
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    gated_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
  lora_config:
    rank: 8
    alpha: 16
    lora_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  optimizer:
    lr: 0.0001
    lr_decay_style: cosine
  accelerator:
    init_device: meta
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
data:
  train_path: ./data/sharegpt4v.parquet
  data_type: conversation
  max_seq_len: 1024
  source_name: sharegpt4v_sft
  mm_configs:
    scale_factor: 28
    image_min_pixels: 3136
    image_max_pixels: 200704
    video_min_pixels: 100352
    video_max_pixels: 602112
    max_ratio: 200
    min_frames: 4
    max_frames: 20
    frame_factor: 2
    sample_rate: 16000
    fps: 2.0
    use_audio_in_video: true
  datasets_type: mapping
train:
  num_train_epochs: 1
  micro_batch_size: 1
  global_batch_size: 8
  checkpoint:
    output_dir: outputs/qwen3_omni_moe/ascend
    manager: dcp
    save_hf_weights: false
  wandb:
    enable: false
  dyn_bsz: false
