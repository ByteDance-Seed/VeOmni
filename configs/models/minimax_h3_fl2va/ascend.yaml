# MiniMax-H3 FL2VA on 8 × 910B2.
# NPROC_PER_NODE=8 bash train.sh tasks/train_dit.py configs/models/minimax_h3_fl2va/ascend.yaml
model:
  model_path: ./MiniMax-H3/FL2VA/transformer
  condition_model_path: ./MiniMax-H3/FL2VA
  config_path: ./MiniMax-H3/FL2VA/transformer/config.json
  condition_model_cfg:
    base_model_path: ./MiniMax-H3/FL2VA
    skip_encoder_load: true
    use_keyframe_condition: true
    keyframe_indices:
    - 0
    - -1
    video_max_frames: 120
    video_max_resolution: 832
    sigma_shift_video: 12.0
    sigma_shift_audio: 3.0
    imgvid_cond_noise_aug: 0.999
    audio_cond_noise_aug: 1.0
  ops_implementation:
    attn_implementation: sdpa
    rotary_pos_emb_implementation: eager
    rms_norm_implementation: eager
    gated_mlp_implementation: eager
    cross_entropy_loss_implementation: eager
    moe_implementation: eager
    load_balancing_loss_implementation: eager
  optimizer:
    type: adamw
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.999
    lr_decay_style: linear
    lr_min: 1.0e-05
    lr_warmup_ratio: 0.0
    weight_decay: 0.01
  accelerator:
    init_device: meta
    ulysses_size: 1
    gradient_checkpointing:
      enable: true
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
  lora_config:
    rank: 4
    alpha: 8
    lora_modules:
    - qkv_proj
    - out_proj
data:
  train_path: ./data/fl2va_latents.parquet
  data_type: diffusion
  source_name: minimax_h3
  data_transform: dit_offline
  datasets_type: mapping
  dataset_repeat: true
  log_sample: false
  text_keys: text
  dataloader:
    num_workers: 0
train:
  training_task: offline_training
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  seed: 42
  num_train_epochs: 1
  max_steps: 3
  profile:
    enable: false
  checkpoint:
    output_dir: outputs/minimax_h3_fl2va/ascend
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
