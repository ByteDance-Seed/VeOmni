# hf download deepseek-ai/DeepSeek-V4-Flash-Base --local-dir ./DeepSeek-V4-Flash-Base
# bash train.sh tasks/train_text.py configs/models/deepseek_v4/cuda.yaml

model:
  model_path: ./DeepSeek-V4-Flash-Base
  chat_template: chatml
  ops_implementation:
    attn_implementation: eager
    moe_implementation: eager
    rotary_pos_emb_implementation: eager
    rms_norm_implementation: eager
    gated_mlp_implementation: eager
    cross_entropy_loss_implementation: eager
    load_balancing_loss_implementation: eager
  accelerator:
    init_device: meta
    fsdp_config:
      fsdp_mode: fsdp2
  optimizer:
    type: adamw
    lr: 0.0001
  lora_config:
    rank: 8
    alpha: 16
    lora_modules:
    - q_a_proj
    - q_b_proj
data:
  train_path: ./data/text.parquet
  data_type: plaintext
  text_keys: text
  max_seq_len: 2048
  datasets_type: mapping
train:
  dyn_bsz: false
  global_batch_size: null
  micro_batch_size: 1
  num_train_epochs: 1
  checkpoint:
    output_dir: outputs/deepseek_v4/cuda
    manager: dcp
    save_hf_weights: false
  wandb:
    enable: false
