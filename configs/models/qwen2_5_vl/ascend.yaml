# hf download Qwen/Qwen2.5-VL-3B-Instruct --local-dir ./Qwen2.5-VL-3B-Instruct
# bash train.sh tasks/train_vlm.py configs/models/qwen2_5_vl/ascend.yaml

model:
  model_path: ./Qwen2.5-VL-3B-Instruct
  ops_implementation:
    attn_implementation: flash_attention_2
  optimizer:
    lr: 1.0e-05
    lr_decay_style: cosine
  accelerator:
    gradient_checkpointing:
      enable_reentrant: false
    init_device: meta
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
  chat_template: qwen2_5vl
data:
  train_path: sharegpt4v_instruct_gpt4-vision_cap100k_coco.json
  data_type: conversation
  max_seq_len: 1024
  mm_configs:
    image_max_pixels: 200704
    video_max_pixels: 602112
    max_frames: 16
    fps: 2.0
    use_audio_in_video: false
  datasets_type: mapping
  source_name: sharegpt4v_sft
train:
  wandb:
    enable: false
  freeze_vit: false
  num_train_epochs: 1
  micro_batch_size: 1
  global_batch_size: 8
  checkpoint:
    output_dir: outputs/qwen2_5_vl/ascend
    manager: dcp
    save_hf_weights: false
  dyn_bsz: false
