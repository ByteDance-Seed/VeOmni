# Qwen2.5-VL-3B-Instruct on 8 × H20.
# NPROC_PER_NODE=8 bash train.sh tasks/train_vlm.py configs/models/qwen2_5_vl/cuda.yaml
model:
  model_path: ./Qwen2.5-VL-3B-Instruct
  ops_implementation:
    attn_implementation: flash_attention_2
  optimizer:
    lr: 1.0e-05
    lr_decay_style: cosine
  accelerator:
    gradient_checkpointing:
      enable_reentrant: false
    init_device: meta
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
  chat_template: qwen2_5vl
data:
  train_path: ./data/sharegpt4v.parquet
  data_type: conversation
  max_seq_len: 1024
  mm_configs:
    image_max_pixels: 200704
    video_max_pixels: 602112
    max_frames: 16
    fps: 2.0
    use_audio_in_video: false
  datasets_type: mapping
  dataloader:
    num_workers: 0
  source_name: sharegpt4v_sft
train:
  wandb:
    enable: false
  freeze_vit: false
  num_train_epochs: 1
  micro_batch_size: 1
  global_batch_size: 8
  max_steps: 3
  profile:
    enable: false
  checkpoint:
    output_dir: outputs/qwen2_5_vl/cuda
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  dyn_bsz: false
