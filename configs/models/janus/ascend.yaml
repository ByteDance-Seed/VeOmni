# Janus-1.3B on 8 × 910B2.
# NPROC_PER_NODE=8 bash train.sh tasks/omni/train_omni.py configs/models/janus/ascend.yaml
model:
  model_path: ./Janus-1.3B-split
  model_config:
    modules:
      janus_siglip:
        model_path: janus_siglip
        broadcast_model_weights_from_rank0: false
        accelerator:
          init_device: npu
          fsdp_config:
            fsdp_mode: ddp
      janus_vqvae:
        model_path: janus_vqvae
        ops_implementation:
          attn_implementation: eager
        accelerator:
          gradient_checkpointing:
            enable: false
      janus_text_encoder:
        model_path: janus_text_encoder
        accelerator:
          extra_parallel_sizes:
          - 4
          extra_parallel_names:
          - emb
          extra_parallel_placement_innermost:
          - false
          gradient_checkpointing:
            enable: false
      janus_llama:
        model_path: janus_llama
        ops_implementation:
          attn_implementation: flash_attention_2
        accelerator:
          fsdp_config:
            fsdp_mode: fsdp2
    train_graph: configs/seed_omni/Janus/janus/train/graph_train.yaml
    infer_graph:
      infer_gen: configs/seed_omni/Janus/janus/infer/graph_infer_gen.yaml
      infer_und: configs/seed_omni/Janus/janus/infer/graph_infer_und.yaml
    infer_type: infer_gen
  ops_implementation:
    attn_implementation: flash_attention_2
  accelerator:
    init_device: meta
    gradient_checkpointing:
      enable: true
      enable_reentrant: false
    fsdp_config:
      fsdp_mode: fsdp2
      reshard_after_forward: true
      reshard_after_backward: true
      forward_prefetch: true
      offload: false
      max_load_broadcast_size: 20.0
      mixed_precision:
        enable: true
        param_dtype: bfloat16
        reduce_dtype: float32
    offload_config:
      enable_activation: false
      activation_gpu_limit: 0.0
  optimizer:
    type: adamw
    lr: 0.0001
    lr_min: 1.0e-06
    lr_start: 0.0
    lr_warmup_ratio: 0.03
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    weight_decay: 0.01
    max_grad_norm: 1.0
    no_decay_params: []
    no_decay_modules: []
data:
  data_type: seedomni
  max_seq_len: 4096
  train_path: ./data/sharegpt4v.parquet
  datasets_type: mapping
  multisource_datasets_type: veomni_weighted_multisource
  train_sample: 1000000
  dataloader:
    num_workers: 0
  source_name: sharegpt4v_sft
train:
  seed: 42
  num_train_epochs: 1
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  checkpoint:
    output_dir: outputs/janus/ascend
    manager: dcp
    save_steps: 3
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
  max_steps: 3
  profile:
    enable: false
infer:
  generation_kwargs:
    max_new_tokens: 2048
    temperature: 0.0
    top_p: 1.0
    do_sample: false
    guidance_scale: 5.0
