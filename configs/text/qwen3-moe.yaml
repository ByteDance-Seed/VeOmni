model:
  model_path: Qwen3-30B-A3B-merge
  ops_implementation:
    attn_implementation: flash_attention_2
    moe_implementation: fused_triton
  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_warmup_ratio: 0.007
    lr_decay_style: cosine
    max_grad_norm: 1.0
  accelerator:
    gradient_checkpointing:
      enable: true
    init_device: meta
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false

data:
  train_path: tulu-3-sft-mixture
  data_type: conversation
  chat_template: chatml
  max_seq_len: 2048
  train_size: 750000
  text_keys: messages
  dyn_bsz_buffer_size: 200

train:
  global_batch_size: 8
  micro_batch_size: 1
  bsz_warmup_ratio: 0.007
  num_train_epochs: 3
  enable_full_determinism: false
  empty_cache_steps: 500
  checkpoint:
    output_dir: Qwen3-30B-A3B-sft-tulu
    manager: dcp
    save_steps: 100
    save_epochs: 1
    save_hf_weights: true
  wandb:
    project: VeOmni
    name: Qwen3-30B-A3B-sft-tulu
