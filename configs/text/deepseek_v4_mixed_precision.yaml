# Standalone per-site `overrides` example for DeepSeek-V4-Flash.
#
# Most runs only need a plain family selection without `overrides` — see
# `deepseek_v4_qat.yaml` (all-QAT default) and `qwen3_nvfp4_qat.yaml`
# (torchao NVFP4 default). Use `overrides` only when specific layers or
# projections need a different row or kwargs (later rules win; `site` is
# matched with `re.fullmatch`).

model:
  model_path: DeepSeek-V4-Flash-Base
  ops_implementation:
    # Quantize attention/indexer projections, keeping layer 0 in BF16.
    linear_implementation:
      name: qat
      overrides:
        - site: 'layers\.0\..*'
          name: eager
    # Quantize the shared expert everywhere except layer 0.
    gated_mlp_implementation:
      name: qat
      overrides:
        - site: 'layers\.0\.mlp'
          name: liger_kernel
    # Whole-family selections need no overrides.
    moe_implementation: deepgemm
    kv_round_implementation: triton
