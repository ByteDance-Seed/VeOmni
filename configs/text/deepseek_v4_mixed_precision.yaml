# DeepSeek-V4-Flash SFT that quantizes only part of the model.
#
# `deepseek_v4_qat.yaml` selects one row for every site of each family. This file
# shows the other shape: a family field may be a mapping whose `overrides` list
# changes the row for some sites and leaves the rest alone. Both halves are needed
# in practice -- a deployment kernel often covers part of the network, and training
# a rounding it will never perform is worse than not training it at all.
#
# The shape of one family field:
#
#   <family>_implementation:
#     name: <row>                 # eager | qat | torchao_nvfp4 | deepgemm_fp8 | ...
#     kwargs:                     # arguments the row takes; optional
#       block_size: 128
#     overrides:
#       - site: <regex>           # fullmatch against the model's site string
#         name: <row>             # optional, replaces `name` at these sites
#         kwargs: {...}           # optional, merged over the outer kwargs
#
# The row name already carries the three things that used to be separate fields:
# `qat` is fake FP8 through TileLang, `torchao_nvfp4` is fake NVFP4,
# `deepgemm_fp8` is the vendor's real FP8 GEMM. What a row still needs per call is
# its *arguments* -- `block_size` for the GEMM rows, `expert_dtype` for the routed
# experts -- and those live in `kwargs`. Precision is not an argument: it is what
# the name says.
#
# Only a quantizing row takes arguments, because an argument says *how* to round.
# A reference row (`eager`, `fused_triton`, `liger_kernel`) rounds nothing, so
# naming one in an override means dropping the inherited arguments:
# `kwargs: {}` with `replace_kwargs: true`. Both mistakes -- an argument the row
# does not accept, and any argument on a non-quantizing row -- raise at config
# parse time, so a typo cannot silently drop the setting it meant to write.
#
# A bare string still works and means "one row everywhere", which is what every
# existing config and checkpoint records.
#
# Site strings this model publishes (see `DeepseekV4Attention.__init__` and the
# compressors/indexer in `deepseek_v4_gpu_patch_gen_config.py`):
#
#   layers.<i>.q_a_proj        layers.<i>.q_b_proj       layers.<i>.kv_proj
#   layers.<i>.o_a_proj        layers.<i>.o_b_proj
#   layers.<i>.mlp             the shared expert
#   layers.<i>.experts         the routed experts
#   layers.<i>.window_kv       the main attention's stored KV
#   layers.<i>.hca_kv          the heavily-compressed attention's stored KV
#   layers.<i>.csa_kv          the compressed-sparse attention's stored KV
#   layers.<i>.indexer         the indexer's stored activations
#   layers.<i>.indexer_q_b_proj

model:
  model_path: DeepSeek-V4-Flash-Base
  ops_implementation:

    # ------------------------------------------------------------------
    # Dense projections. Layers 0-9 run in the model dtype: the deployment
    # kernel covers 10-58 only, so rounding the first ten would train a
    # rounding nothing performs. The grouped output projection takes a
    # different row, which is why it gets its own rule after the broad one.
    # ------------------------------------------------------------------
    linear_implementation:
      name: eager
      overrides:
        - site: "layers\\.(1[0-9]|[2-4][0-9]|5[0-8])\\.(q_a_proj|q_b_proj|kv_proj|o_a_proj|o_b_proj)"
          name: qat
          kwargs:
            block_size: 128
        # A different quantizer: `torchao_nvfp4` is NVFP4 by name, and takes only
        # `block_size`, so the inherited width is replaced rather than merged.
        - site: "layers\\.(1[0-9]|[2-4][0-9]|5[0-8])\\.o_a_proj"
          name: torchao_nvfp4
          kwargs:
            block_size: 16
          replace_kwargs: true

    # ------------------------------------------------------------------
    # Shared expert. Quantized everywhere except layer 0, which the
    # checkpoint stores in BF16.
    # ------------------------------------------------------------------
    swiglu_mlp_implementation:
      name: qat
      kwargs:
        block_size: 128
      overrides:
        # A reference row rounds nothing, so it takes no arguments: the inherited
        # `block_size` is dropped with `replace_kwargs` rather than passed to a row
        # that would refuse it.
        - site: "layers\\.0\\.mlp"
          name: liger_kernel
          kwargs: {}
          replace_kwargs: true

    # ------------------------------------------------------------------
    # Routed experts: the vendor's real FP8 grouped GEMM, not fake
    # quantization. This is the "everything off, the experts on" shape.
    #
    # `expert_dtype` is deliberately absent: the row falls back to the
    # checkpoint's own, which is FP4 on V4-Flash. The modeling passes it as a
    # call argument, and the config would win over it if it set one -- say
    # `expert_dtype: fp8` here to train the experts at FP8 even though the
    # checkpoint stored them in FP4.
    # ------------------------------------------------------------------
    moe_implementation:
      name: fused_triton
      overrides:
        - site: "layers\\.\\d+\\.experts"
          name: deepgemm_fp8

    # ------------------------------------------------------------------
    # Stored KV and indexer activations. `kv_round` is not per-site: it rounds
    # *stored* tensors rather than GEMM operands, so
    # `none`/`eager`/`triton` is the whole space and there is no row argument
    # to choose.
    # ------------------------------------------------------------------
    kv_round_implementation: triton

# Hardware: `qat` needs NVIDIA SM90+ and the `tilelang` package; `deepgemm_fp8`
# needs SM90/SM100 and `deep_gemm`; `torchao_nvfp4` needs the `torchao` package;
# the Triton `kv_round` row needs SM89+ or ROCm. A selection this host cannot
# serve fails when the handle is built, not mid-training.
