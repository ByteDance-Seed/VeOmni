model:
  model_path: Qwen3.5-27B
  ops_implementation:
    attn_implementation: eager
    rms_norm_implementation: npu
    rotary_pos_emb_implementation: npu
    cross_entropy_loss_implementation: chunk_loss
    rms_norm_gated_implementation: fla_npu
    causal_conv1d_implementation: fla_npu
    chunk_gated_delta_rule_implementation: fla_npu
  model_config:
    text_config:
      mtp_loss_weight: 0.3

data:
  train_path: tulu-3-sft-mixture
  data_type: conversation
  chat_template: chatml
  max_seq_len: 1024
  train_size: 500
  text_keys: messages

train:
  accelerator:
    ulysses_size: 1
    cp_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: true
  gradient_checkpointing:
    enable: true
  micro_batch_size: 1
  global_batch_size: 16
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-5
    lr_decay_style: cosine
    max_grad_norm: 1.0
  num_train_epochs: 1
  max_steps: 1
  init_device: meta
  empty_cache_steps: 500
  checkpoint:
    output_dir: Qwen3.5-27B-mtp-npu
    manager: dcp
    save_steps: 0
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
